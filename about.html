<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About | Maven Crown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B3A24;
    --ink-2:#0F4A2E;
    --paper:#F7F6F2;
    --paper-dim:#EFEBE0;
    --green:#1F7043;
    --orange:#D97422;
    --orange-light:#F0A860;
    --text:#182420;
    --muted:#57625B;
    --line:#DED8C8;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{max-width:100%;overflow-x:hidden;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--text);background:var(--paper);line-height:1.6;}
  h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);margin:0;line-height:1.1;letter-spacing:-.01em;}
  .eyebrow{position:relative;display:inline-flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#fff;font-weight:600;background:var(--orange);padding:6px 16px 6px 12px;clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%);}
  .hero .eyebrow{background:var(--orange);color:var(--ink);}
  .section-head .eyebrow,.section-head.center .eyebrow{background:var(--ink);color:var(--orange-light);}
  .container{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,24px);}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;height:auto;display:block;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--orange);outline-offset:3px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:var(--radius);font-weight:600;font-size:.92rem;cursor:pointer;border:1px solid transparent;transition:transform .15s,background .2s,color .2s;min-height:44px;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:#c4650f;}
  .btn-ghost{border-color:rgba(247,246,242,.45);color:#fff;}
  .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.08);}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:var(--green);}
  .section-head{max-width:640px;margin-bottom:clamp(24px,4vw,36px);}
  .section-head.center{max-width:640px;margin-left:auto;margin-right:auto;text-align:center;}
  .section-head h2{font-size:clamp(1.5rem,3.6vw,2rem);margin-top:10px;}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  }

  /* FLOATING WHATSAPP + BACK TO TOP */
  .float-whatsapp{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.22);z-index:200;transition:transform .2s;}
  .float-whatsapp:hover{transform:scale(1.08);}
  .float-whatsapp svg{width:28px;height:28px;}
  .back-to-top{position:fixed;right:20px;bottom:86px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.18);z-index:200;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s,background .2s;}
  .back-to-top.is-visible{opacity:1;pointer-events:auto;transform:translateY(0);}
  .back-to-top:hover{background:var(--orange);}
  .back-to-top svg{width:20px;height:20px;}
  @media (max-width:560px){
    .float-whatsapp{width:50px;height:50px;right:14px;bottom:14px;}
    .float-whatsapp svg{width:24px;height:24px;}
    .back-to-top{width:40px;height:40px;right:16px;bottom:74px;}
  }

  /* NAV */
  .navbar{position:sticky;top:0;z-index:100;background:rgba(247,246,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(16px,4vw,24px);max-width:1180px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand img{height:40px;width:auto;flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;min-width:0;}
  .brand-text b{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;color:var(--ink);white-space:nowrap;}
  .brand-text span{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.08em;color:var(--orange);text-transform:uppercase;white-space:nowrap;}
  .nav-links{display:flex;gap:clamp(14px,2vw,26px);list-style:none;margin:0;padding:0;}
  .nav-links a{font-size:.88rem;font-weight:500;color:var(--text);padding-bottom:4px;border-bottom:2px solid transparent;transition:border-color .2s;white-space:nowrap;}
  .nav-links a.active,.nav-links a:hover{border-color:var(--orange);}
  .nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .nav-cta{background:var(--ink);color:#fff!important;padding:10px 18px;border-radius:var(--radius);font-size:.85rem;font-weight:600;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;}
  .nav-cta:hover{background:var(--orange);}
  .nav-toggle{display:none;background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--ink);padding:6px;min-width:44px;min-height:44px;align-items:center;justify-content:center;}
  .mobile-menu{display:none;flex-direction:column;background:var(--paper);border-top:1px solid var(--line);padding:8px clamp(16px,4vw,24px) 18px;}
  .mobile-menu a{padding:13px 0;font-size:.98rem;font-weight:500;border-bottom:1px solid var(--line);}
  .mobile-menu .mobile-quote{color:var(--orange);font-weight:700;}
  .mobile-menu.is-open{display:flex;}

  /* HERO SLIDER */
  .hero{position:relative;background:var(--ink);color:#fff;overflow:hidden;}
  .hero::before{content:"";position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(247,246,242,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(247,246,242,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,transparent,rgba(0,0,0,.9) 40%,transparent 95%);pointer-events:none;}
  .hero-slides{position:relative;z-index:2;}
  .hero-slide{display:none;padding:clamp(56px,9vw,100px) 0 clamp(40px,7vw,84px);}
  .hero-slide.is-active{display:block;animation:fadeIn .6s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,48px);align-items:center;}
  .hero h1{font-size:clamp(1.6rem,4.6vw,2.7rem);color:#fff;margin:14px 0 18px;letter-spacing:-.01em;}
  .hero p.lead{font-size:clamp(.95rem,2vw,1.06rem);color:#D7DCD3;max-width:520px;margin-bottom:28px;}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;}
  .crest-panel{position:relative;justify-self:center;width:100%;max-width:280px;aspect-ratio:1/1;border:1px solid rgba(247,246,242,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(217,116,34,.14),transparent 70%);}
  .crest-panel::before{content:"";position:absolute;inset:20px;border:1px solid rgba(217,116,34,.35);border-radius:50%;}
  .crest-panel img{width:56%;height:auto;}
  .hero-controls{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:16px;padding-bottom:clamp(24px,4vw,38px);flex-wrap:wrap;}
  .hero-arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(247,246,242,.35);background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0;}
  .hero-arrow:hover{background:rgba(247,246,242,.12);}
  .hero-dots{display:flex;gap:6px;}
  .hero-dot{width:36px;height:36px;padding:0;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .hero-dot::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(247,246,242,.35);transition:width .2s,background .2s;}
  .hero-dot.is-active::after{background:var(--orange);width:22px;border-radius:5px;}
  .skyline-divider{display:block;width:100%;height:56px;position:relative;z-index:3;margin-top:-4px;}
  .skyline-divider polygon{fill:var(--paper-dim);}

  /* MARQUEE TICKER */
  .marquee{background:var(--orange);overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);}
  .marquee-track{display:inline-flex;align-items:center;gap:14px;padding:12px 0;animation:marquee 26s linear infinite;}
  .marquee-track span{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#fff;}
  .marquee-track span.dot{font-size:.5rem;color:var(--ink);opacity:.6;}
  .marquee:hover .marquee-track{animation-play-state:paused;}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* STATS STRIP */
  .stats{background:var(--paper-dim);border-bottom:1px solid var(--line);padding:26px 0;}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center;}
  .stats-grid div b{display:block;font-family:'Fraunces',serif;font-size:clamp(1.25rem,3vw,1.6rem);color:var(--ink);}
  .stats-grid div span{font-size:.76rem;color:var(--muted);}

  /* AUDIENCE TABS */
  .audience{padding:clamp(48px,7vw,80px) 0 clamp(24px,4vw,40px);}
  .tabs{display:flex;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tab-btn{font-family:'IBM Plex Mono',monospace;font-size:.78rem;letter-spacing:.04em;padding:10px 4px;margin-right:22px;background:none;border:none;cursor:pointer;color:#8a8474;border-bottom:2px solid transparent;transform:translateY(1px);white-space:nowrap;min-height:44px;}
  .tab-btn.is-active{color:var(--ink);border-color:var(--orange);font-weight:600;}
  .tab-panel{display:none;}
  .tab-panel.is-active{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,40px);align-items:start;}
  .tab-panel p{font-size:1rem;color:var(--muted);max-width:480px;}
  .tab-services{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .tab-services li{display:flex;gap:12px;font-size:.92rem;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);}
  .tab-services li span{color:var(--orange);font-family:'IBM Plex Mono',monospace;font-weight:600;}

  /* SERVICES */
  .services{padding:clamp(48px,7vw,76px) 0;background:var(--paper-dim);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px;}
  .service-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px 22px;transition:border-color .2s,transform .2s,box-shadow .2s;}
  .service-card:hover{transform:translateY(-4px);border-color:var(--orange);box-shadow:0 14px 30px rgba(11,58,36,.08);}
  .service-card .icon{width:42px;height:42px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .service-card .icon svg{width:20px;height:20px;stroke:var(--orange-light);}
  .service-card h4{font-size:1.02rem;margin-bottom:8px;}
  .service-card p{margin:0;font-size:.9rem;color:var(--muted);}

  /* PROCESS */
  .process{padding:clamp(48px,7vw,80px) 0;}
  .process-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:36px;counter-reset:step;}
  .process-step{position:relative;padding:24px 18px 18px;border-left:2px solid var(--line);}
  .process-step b.num{font-family:'IBM Plex Mono',monospace;color:var(--orange);font-size:.85rem;display:block;margin-bottom:10px;}
  .process-step h4{font-size:.98rem;margin-bottom:6px;}
  .process-step p{margin:0;font-size:.86rem;color:var(--muted);}

  /* PORTFOLIO SLIDER */
  .portfolio{padding:clamp(48px,7vw,80px) 0;background:var(--paper-dim);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .portfolio-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
  .portfolio-nav{display:flex;gap:10px;}
  .pf-arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;flex-shrink:0;}
  .pf-arrow:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  .portfolio-track-wrap{overflow:hidden;margin-top:28px;}
  .portfolio-track{display:flex;gap:20px;transition:transform .45s cubic-bezier(.65,0,.35,1);}
  .portfolio-item{position:relative;flex:0 0 calc((100% - 40px)/3);aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;background:var(--ink);}
  .portfolio-item img{width:100%;height:100%;object-fit:cover;opacity:.88;transition:opacity .2s,transform .3s;}
  .portfolio-item:hover img{opacity:1;transform:scale(1.05);}
  .portfolio-tag{position:absolute;left:12px;bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.05em;color:#fff;background:rgba(11,58,36,.78);padding:6px 10px;border-radius:var(--radius);}

  /* TESTIMONIALS */
  .testimonials{padding:clamp(48px,7vw,80px) 0;}
  .testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px;}
  .testi-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;}
  .testi-card p{font-size:.94rem;color:var(--text);margin:0 0 18px;}
  .testi-who{display:flex;align-items:center;gap:12px;}
  .testi-avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--orange-light);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:.85rem;flex-shrink:0;}
  .testi-who b{display:block;font-size:.88rem;}
  .testi-who span{font-size:.78rem;color:var(--muted);}

  /* NEWSLETTER */
  .newsletter{background:var(--paper-dim);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:clamp(40px,6vw,56px) 0;}
  .newsletter-inner{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;}
  .newsletter h2{font-size:clamp(1.3rem,3vw,1.7rem);margin-top:10px;}
  .newsletter p{color:var(--muted);margin:8px 0 0;font-size:.95rem;}
  .newsletter-form{display:flex;gap:10px;flex-wrap:wrap;}
  .newsletter-form input{flex:1;min-width:200px;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:.94rem;background:#fff;}
  .newsletter-form input:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:var(--orange);}
  .newsletter-note{color:var(--muted);font-size:.78rem;margin:14px auto 0;text-align:center;}

  /* CTA */
  .cta{background:var(--ink);color:#fff;padding:clamp(48px,7vw,72px) 0;text-align:center;position:relative;overflow:hidden;}
  .cta h2{color:#fff;font-size:clamp(1.4rem,3.6vw,1.9rem);margin-bottom:12px;}
  .cta p{color:#C9D0C9;max-width:520px;margin:0 auto 28px;font-size:.96rem;}

  /* FOOTER */
  footer{background:#0A2E1D;color:#C9D0C9;padding:clamp(40px,6vw,56px) 0 24px;font-size:.92rem;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;margin-bottom:36px;}
  footer h3{color:#fff;font-size:1rem;margin-bottom:14px;}
  .footer-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .footer-brand img{height:34px;}
  .footer-brand b{color:#fff;font-family:'Fraunces',serif;font-size:1.02rem;}
  footer p{font-size:.88rem;}
  footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  footer li{word-break:break-word;}
  footer a:hover{color:var(--orange-light);}
  .footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.78rem;color:#8B9A8F;}

  /* Large tablet / small laptop: tighten nav before it has to wrap */
  @media (max-width:1080px){
    .nav-links{gap:14px;}
    .nav-links a{font-size:.84rem;}
  }
  /* Tablet: switch to mobile nav here so nothing overlaps or wraps awkwardly */
  @media (max-width:1024px){
    .nav-links{display:none;}
    .nav-toggle{display:flex;}
    .hero-grid{grid-template-columns:1fr;text-align:left;}
    .crest-panel{max-width:200px;margin:0;}
    .hero-actions{margin-top:4px;}
  }
  @media (max-width:860px){
    .newsletter-inner{grid-template-columns:1fr;text-align:left;}
    .stats-grid{grid-template-columns:repeat(2,1fr);gap:20px;}
    .tab-panel.is-active{grid-template-columns:1fr;}
    .service-grid{grid-template-columns:1fr 1fr;}
    .process-grid{grid-template-columns:1fr 1fr;}
    .portfolio-item{flex:0 0 calc((100% - 20px)/2);}
    .testi-grid{grid-template-columns:1fr;}
    .footer-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .brand-text span{display:none;}
    .nav-cta{padding:9px 14px;font-size:.8rem;}
    .service-grid{grid-template-columns:1fr;}
    .process-grid{grid-template-columns:1fr;}
    .process-step{padding-left:16px;}
    .portfolio-item{flex:0 0 100%;}
    .footer-grid{grid-template-columns:1fr;}
    .stats-grid{grid-template-columns:1fr 1fr;gap:14px;}
    .hero-actions{flex-direction:column;align-items:stretch;}
    .hero-actions .btn{width:100%;}
    .portfolio-head{align-items:center;}
  }
  @media (max-width:400px){
    .brand-text{display:none;}
    .nav-cta{display:none;}
    .stats-grid{grid-template-columns:1fr 1fr;}
    .crest-panel{max-width:160px;}
    .hero-controls{gap:10px;}
  }
</style>

<style>
  /* Shared extra components for inner pages */
  .pull-quote{border-left:3px solid var(--orange);padding:18px 22px;background:var(--paper-dim);font-family:'Fraunces',serif;font-style:italic;font-size:1.15rem;color:var(--ink);margin:28px 0;}
  .pull-quote span{display:block;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

  .story{padding:clamp(48px,7vw,80px) 0;}
  .story-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(24px,4vw,40px);align-items:start;}
  .story-grid p{color:var(--muted);font-size:1rem;margin-bottom:16px;}
  .story-side{background:var(--ink);color:#fff;padding:28px 24px;border-radius:var(--radius);}
  .story-side h3{color:#fff;font-size:1.1rem;margin-bottom:14px;}
  .story-side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .story-side li{font-size:.9rem;color:#D7DCD3;display:flex;gap:10px;}
  .story-side li b{color:var(--orange-light);font-family:'IBM Plex Mono',monospace;flex-shrink:0;}

  .info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:32px;}

  .form-section{padding:clamp(48px,7vw,80px) 0;}
  .contact-grid,.quote-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:32px;align-items:start;}
  .form-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,4vw,36px);}
  .field{margin-bottom:18px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.82rem;font-weight:600;color:var(--ink);}
  .field input,.field select,.field textarea{font-family:'Inter',sans-serif;font-size:.94rem;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--text);min-height:44px;width:100%;}
  .field textarea{min-height:120px;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:var(--orange);}
  .field-row{display:grid;
